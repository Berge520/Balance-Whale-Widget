<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 气泡共享样式（与悬浮窗同一份，构建时由 public/ 拷进 dist 根）：按压气泡预览容器复用 -->
    <link rel="stylesheet" href="./floating-bubble.css" />
    <script>
      // 首帧深浅色预涂：同步跑在 bundle 之前。深浅应用原本在 Vue 启动后（400KB+ JS 解析完）才挂
      // dark 类，深色用户每次打开设置页都先闪一段浅色；且启动应用拿的还是本地默认 uiMode(auto)，
      // 存储里的手动 light/dark 要等 applyConfig 回填、不重应用就拖到下一轮轮询 —— 体感「隔一会才变」。
      // 合成口径与 store.js normUiMode / App.vue applyUtoolsDark 一致；键名由 check-shared 钉住。
      try {
        var ui = utools.dbStorage.getItem('whale:config')
        var mode = 'auto'
        if (ui && (ui.uiMode === 'light' || ui.uiMode === 'dark' || ui.uiMode === 'fantasy')) mode = ui.uiMode
        if (mode === 'fantasy') {
          document.documentElement.classList.add('dark')
          document.documentElement.classList.add('fantasy')
        } else if (mode === 'dark' || (mode === 'auto' && utools.isDarkColors())) {
          document.documentElement.classList.add('dark')
        }
        // 背景氛围首帧预涂：仅「未至之境」生效，与 App.vue 的 applyBg 同口径
        if (ui && ['deep', 'aurora', 'stars', 'mist', 'polar', 'warm', 'video', 'custom'].indexOf(ui.bgMode) >= 0) {
          document.documentElement.classList.add('bg-' + ui.bgMode)
        }
        // 纯净片头：先藏住设置页，等 App 判断这次到底播不播；播完/判定不播时由 App 移除此类。
        // 8s 兜底：App 加载失败时不至于永远白屏。
        if (ui && ui.bootIntroOn === true && ui.bootIntroClean === true) {
          document.documentElement.classList.add('boot-intro-pending')
          setTimeout(function () {
            document.documentElement.classList.remove('boot-intro-pending')
          }, 8000)
        }
      } catch (err) { /* 无 utools 环境（浏览器直开）保持浅色，Vue 启动后自会纠正 */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
